# =============================================================================
# primary_nk_cells / 01_cells
# None = every cost's weight AND constant zeroed, appear/disappear 50, and
# base_edge_constant = -1500 (sweep `nknone`, 2026-10-13). -1500 is Flow's own
# edge constant, and the edge constants only matter through their sum, so Flow =
# None + the drift-weight term exactly. The swept range: c = -25 / -50 / -100 /
# -200 / -500 / -1500 gave TE 0.209 / 0.214 / 0.237 / 0.219 / 0.220 / 0.220; from
# -200 on the solution saturates (every selectable edge taken). The matched
# value was chosen over the best c (-100), 0.018 TE lower, to keep that step exact.
#
# Every "+ X" adds X onto None (sweep `nkadd`, 2026-10-13), each X at its Full
# value, NOT re-tuned. As in MDA231, an edge cost brings its own constant in
# place of base_edge_constant (+ Flow, + Volume: -1500, so they differ from None
# by the weight term alone; + Intensity: -1000), and a node cost keeps the -1500
# offset (+ Adhesion). + Flow is nknone's drift_only_repro, which reproduces
# Phase 2 drift_only exactly. Full = solver_ablation [nk_cells] Full (cohesion
# off), and the reference line is Full. (The Phase 2 add_* runs added X onto Flow
# instead; they are no longer in this table.) Cohesion is left out: it is not in
# Full, so it has no ablation counterpart (nkadd/runs/plus_cohesion, TE 0.2060 /
# FN 26 / AOGM 524, is on disk).
#
# Sparse GT (gt/manual, corrected 2026-07-30), point matcher, match_threshold = 10,
# so no metric counts false positives. "AOGM" here = traccuracy's plain "aogm"
# counts (every weight 1) without the two FP terms: non-splits + FN nodes + FN
# edges + wrong-semantic edges. Bars are in descending TE.
# =============================================================================
[nk_cells]
output_dir = "Y:/jennifer/mhat/experiments/primary_nk_cells/01_cells"
output_png = "Y:/jennifer/mhat/experiments/primary_nk_cells/01_cells/figures/solver_addition_results_nk_cells.png"
suptitle = "Primary NK cells Solver Addition"
reference = "full"
base_condition = "none"
xtick_rotation = 30
condition_order = ["full", "plus_volume", "plus_drift", "plus_intensity", "plus_adhesion", "none"]

[nk_cells.metrics.TE]
display_name = "Target Effectiveness"
json_path = ["TrackOverlapMetrics", "target_effectiveness"]
reduction = "scalar"
higher_is_better = true

[nk_cells.metrics.FN]
