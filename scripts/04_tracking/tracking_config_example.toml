# IO
# The raw movie: a zarr array (t, c, *spatial) with an "axes" attribute.
raw_path = "/path/to/data/movie.zarr"
# One directory per raw movie, the same one segmentation and optical flow wrote to.
# Runs go to <output_dir>/tracking/<uid>/.
output_dir = "/path/to/results/movie/"

# uids of the runs to read, under <output_dir>/segmentation/ and <output_dir>/opticalflow/
seg_result = "seg_result"
flow_result = "flow_result"

# Optional: a fixed run uid instead of a timestamp. It must not exist yet; to redo a
# run under the same uid, delete its directory first.
# exp_uid = "my_run"

# Print graph attributes table
verbose = false

# ILP params
drift_distance = [ 0.0, 0.0, 0.0,]
drift_weight = 1.0
drift_constant = -10.0
area_weight = 1.0
area_constant = -10.0
intensity_weight = 1.0
intensity_constant = -10.0
curvature_weight = 1.0
curvature_constant = -10.0
cohesion_weight = -1.0
cohesion_constant = 10.0
adhesion_weight = -1.0
adhesion_constant = 10.0
division_weight = 2.0
appear_constant = 2.0
disappear_constant = 2.0

# cand graph creation params
max_children = 3
divisions = false
min_merge_cost = 0.0
max_merge_cost = 1.0
# max distance traveled between frames
max_edge_distance = 60

# fragments smaller than size_threshold will be ignored
size_threshold = 20

# Confidence-based Z flow filtering
z_flow_conf_threshold = 1.0e-7
z_flow_min_pass_pixels = 10
