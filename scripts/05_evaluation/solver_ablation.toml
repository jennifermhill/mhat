suptitle = "NC28.1-Fl2mSiH2B Solver Ablation"
# Solver runs store point-matched TE/TF in track_metrics.json (the merge figure
# used track_metrics_iou.json; the solver figure used point matching).
metrics_filename = "track_metrics.json"
reference = "first"
condition_order = ["baseline", "no_cohesion", "no_drift", "no_all"]

[nc281.metrics.TE]
