# TrackMate vs MHAT comparison figure on NC281-sparse / train.
# One x-group per TrackOverlap metric, two touching bars per group (TrackMate,
# MHAT). Values are loaded from each result's track_metrics.json -- nothing is
# hard-coded here except which tracking result each method points at.
# Rendered by competitor_vs_mhat.py.

output_png = "Y:/jennifer/mhat/experiments/evaluation/NC281-sparse-label/02_nuclei_denoised_train/trackmate_vs_handtuned_nc281_sparse_train.png"
title = ""
ylabel = "Score (higher is better)"

experiment = "NC281-sparse-label"
dataset_dir = "02_nuclei_denoised_train"
eval_base_dir = "Y:/jennifer/mhat/experiments/evaluation"

# x-groups: which TrackOverlapMetrics fields to plot, in order.
metric_order = ["target_effectiveness", "track_fractions", "track_purity"]

[metrics.target_effectiveness]
label = "Target\neffectiveness"
json_path = ["TrackOverlapMetrics", "target_effectiveness"]

[metrics.track_fractions]
label = "Track\nfractions"
json_path = ["TrackOverlapMetrics", "track_fractions"]

[metrics.track_purity]
label = "Track\npurity"
json_path = ["TrackOverlapMetrics", "track_purity"]

# series: the two methods being compared. MHAT is first in each group and gets
# the reddish pink that marks it in the leaderboard figure; the competing method
# is gray, matching the leaderboard convention.
method_order = ["mhat", "trackmate"]

[methods.mhat]
label = "MHAT"
color = "#CC79A7"
tracking_uid = "2026-07-02_10-55-33"  # hand-tuned baseline

[methods.trackmate]
label = "TrackMate"
color = "#B0B0B0"
tracking_uid = "trackmate"
