# IO
input_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/data/"
output_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/segmentation/"
experiment = "iXon_vol2"
dataset = "01_nuclei_denoised"

overwrite = false
merge_thresholds = [1.0]

# segmentation parameters
[seg_params]
seg_method = "otsu"
spot_sigma = 0.5
outline_sigma = 0.5

[seg_params.cellpose_params]
flow_threshold = 0.4
cellprob_threshold = -3.0
batch_size = 32
do_3D = true

[affinity_params]
smoothing = [1, 1, 1]
neighborhood = [[0,0,1], [0,1,0], [1,0,0]]
