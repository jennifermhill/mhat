# NC281-sparse-label SSVM weight-fitting config.
# Initial weights/constants are 0 — bundle method always starts at w=0 internally.
# Graph-construction params (size_threshold, max_edge_distance, etc.) match
# NC281_sparse_baseline.toml so the candidate graph is identical to the
# hand-tuned baseline.

# IO
raw_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/data/"
input_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/"
output_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/"
experiment = "NC281-sparse-label"
dataset = "01_nuclei_denoised"

seg_result = "2026-04-01_11-08-44"
flow_result = "2026-04-01_11-18-35"
use_lk = false

# ILP params (initial values for SSVM; will be overwritten with learned values)
drift_distance = [0.0, 3.0, 6.0]
drift_weight = 0.0
drift_constant = 0.0
area_weight = 0.0
area_constant = 0.0
intensity_weight = 0.0
intensity_constant = 0.0
curvature_weight = 0.0
curvature_constant = 0.0
cohesion_weight = 0.0
cohesion_constant = 0.0
adhesion_weight = 0.0
adhesion_constant = 0.0
appear_constant = 0.0
disappear_constant = 0.0

# cand graph creation params (same as NC281_sparse_baseline.toml)
max_children = 3
merges = false
divisions = false
min_merge_cost = 0.0
max_merge_cost = 1.0
max_edge_distance = 35
size_threshold = 0

# Ablation flags
ablate_cohesion_adhesion = false
ablate_drift = false
ablate_area = false
ablate_intensity = false
ablate_curvature = true  # curvature dominates solve time on NC281-sparse; disabled for fit

# SSVM params
ssvm_reg = 0.1
ssvm_max_iter = 100
ssvm_eps = 1.0e-6
iogt_threshold = 0.5
