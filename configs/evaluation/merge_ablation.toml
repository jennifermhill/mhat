# Merge ablation: running notes + plotting input.
#
# See ABLATION.md (repo root) for the recipe. Fill in seg_uid and tracking_uid
# as runs complete. seg_overrides is informational; the canonical config lives
# in the seg result's saved config.toml.
#
# Condition iteration order is fixed in merge_ablation_figure.py:
# baseline -> no_cohesion -> no_affinities -> no_merges.

# =============================================================================
# Fluo-C3DL-MDA231 / 01_cells
# =============================================================================
# ---------------------------------------------------------------------------
# 2026-07-29 re-optimization. The 2026-07-21 fs1_cpm6 runs re-ran every condition
# on the improved segmentation but kept the ILP weights tuned on the OLD one,
# which left two ablations beating the full model. Every condition was re-swept
# on 01_cells (sweeps figopt0729A..G, ~200 runs; specs in configs/sweeps/) and
# the winners transferred verbatim to 02_cells. uids are now fs1cpm6v2_<cond>;
# the exact parameters per bar are in configs/sweeps/mda231_0{1,2}_cells_final.toml
# and in each run's saved config.toml. Baseline 01_cells 0.9061 -> 0.9122.
#
# Two definitional fixes went in with it: the retired ablate_cohesion_adhesion
# flag meant `- Affinities` had actually been solving with cohesion/adhesion
# ACTIVE, and it plus `- Merges` also carried z_flow_conf_threshold = 0.0, which
# no other condition sets and which is NOT a no-op (the 3D flow zarr does have a
# confidence array, so Z flow was being gated). Both are gone, so every merge bar
# now differs from Baseline in exactly one way.
# ---------------------------------------------------------------------------

[mda231]
output_dir = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells"
output_png = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells/figures/merge_ablation_results_mda231.png"
suptitle = "Fluo-C3DL-MDA231 Merge Ablation"
recall_output_png = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells/figures/merge_ablation_recall_mda231.png"

[mda231.recall_metrics.NodeRecall]
display_name = "Node Recall"
json_path = ["BasicMetrics", "Node Recall"]
reduction = "scalar"

[mda231.recall_metrics.EdgeRecall]
display_name = "Edge Recall"
json_path = ["BasicMetrics", "Edge Recall"]
reduction = "scalar"

[mda231.metrics.TRA]
display_name = "TRA"
json_path = ["CTCMetrics", "TRA"]
reduction = "scalar"

[mda231.metrics.DET]
display_name = "DET"
json_path = ["CTCMetrics", "DET"]
reduction = "scalar"

[mda231.metrics.LNK]
display_name = "LNK"
json_path = ["CTCMetrics", "LNK"]
reduction = "scalar"

[mda231.conditions.baseline]
label = "Baseline"
seg_overrides = ""
# Shared run for baseline (= solver baseline/full); identical config, full data on Y:.
run = "tracking/sweeps/regenF01/runs/baseline"
eval = "ctc_ctc_2026-09-22_16-15-09"
recall_eval = "ctc_basic_2026-09-22_16-18-10"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/baseline_config.toml"

[mda231.conditions.no_cohesion]
label = "- Coh/Adh"
seg_overrides = ""
# Ported from the solver - Coh/Adh re-opt (new zero-cost ablation, drift_w=100,
# z_flow absent). Same seg/flow as the merge baseline.
# Parity retune 2026-10-01: every bar was given the identical 37-point search
# (specs scratch_configs/sweeps/{naff01,coh01,bas01,mrg01}*), rule TRA primary /
# SEG tie-break. Baseline's winner was R0, so its uid is unchanged.
run = "tracking/sweeps/coh01c/runs/a1400_ec500"  # appear = disappear = 1400, area_constant = -1000
eval = "ctc_ctc_2026-10-01_15-51-46"
recall_eval = "ctc_basic_2026-10-01_16-51-41"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_cohesion_config.toml"

# 2026-07-29 RESULT, not an oversight: with cohesion/adhesion zeroed (the
# cumulative ablation ABLATION.md specifies), this bar is within 0.0002 TRA of
# `- Coh/Adh` on 01_cells (0.9097 vs 0.9095; identical fn/ns/Node Recall, and
# Edge Recall marginally lower). The two runs now differ in exactly one key,
# seg_result -- both sweeps converged independently on the same ILP parameters.
# That is the finding: the affinity scoring function reaches the solution mainly
# through the merge scores that become the cohesion/adhesion node attributes, so
# once those costs are removed only the merge tree SHAPE is left, and that alone
# changes almost nothing. The coh/adh-on variant (which scored 0.8910 against
# baseline under the old definition) was considered and deliberately not adopted.
[mda231.conditions.no_affinities]
label = "- Affinities"
seg_overrides = "scoring_function = 'symmetric'"
run = "tracking/sweeps/naff01e/runs/a1400_ec500"  # appear = disappear = 1400, area_constant = -1000
eval = "ctc_ctc_2026-10-01_15-58-19"
recall_eval = "ctc_basic_2026-10-01_16-51-41"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_affinities_config.toml"

[mda231.conditions.no_merges]
label = "- Merges"
seg_overrides = "skip_merges = true, seg_method = 'cellpose'"
run = "tracking/sweeps/mrg01c/runs/app1400"  # appear = disappear = 1400
eval = "ctc_ctc_2026-10-01_16-21-03"
recall_eval = "ctc_basic_2026-10-01_16-51-41"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_merges_config.toml"

