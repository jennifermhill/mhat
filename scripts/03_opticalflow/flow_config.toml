# IO
input_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/data/"
output_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/opticalflow/"
experiment = "Fluo-N3DL-TRIC"
dataset = "01_cells_short"

rerun_uid = ""

# display params
color_wheel = true

# 2D flow parameters
[2d]
do_2d = true
downsample_factor = 1
pyr_scale = 0.8
levels = 3
winsize = 9
iterations = 8
poly_n = 5
poly_sigma = 0.7
[2d.hyperparams]
enhance_contrast = true
temporal_smoothing = true
temporal_smoothing_sigma = 0.7
frame_averaging = 3

# 3D flow parameters
[3d]
do_3d = true
downsample_factor = [1, 1, 1]
pyr_scale = 0.8
levels = 3
winsize = [3, 9, 9]
iterations = 8
poly_n = 5
poly_sigma = [0.15, 0.7, 0.7]
filter_type = "gaussian"
presmoothing = 0.1
[3d.hyperparams]
enhance_contrast = true
temporal_smoothing = true
temporal_smoothing_sigma = 0.7
frame_averaging = 3

# lucas kanade parameters
[lucaskanade]
do_lucaskanade = false
xyz_sig = 5
z_sig = 1
w_sig = 8
t_sig = 1
[lucaskanade.hyperparams]
enhance_contrast = false
