# Solver addition: running notes + plotting input.
#
# See SOLVER_EXPERIMENTS.md (repo root) for the recipe. Solver addition starts
# from the EMPTY model ("None" = every `ablate_*` flag true) and adds ONE tuned
# ILP cost term at a time, up to "Full" (every `ablate_*` flag false = the
# dataset's full tuned baseline). Segmentation is held FIXED (the baseline
# seg_uid) -- only tracking_config changes.
#
# Each "+ X" bar uses its own hand-tuned weight/constant values. Per the agreed
# convention we store only tracking_uid here; the canonical tuned values live in
# that run's saved config.toml. `note` is an informational reminder of which
# cost is active and the rough tuned magnitude.
#
# Drive the plot with:
#   conda run -n mhat2 --no-capture-output \
#     python scripts/07_plotting/solver_figure.py \
#     configs/evaluation/solver_addition.toml --dataset {mda231,mda231_02cells,nc281,nc281_sparse}
#
# Wong colorblind-friendly palette, matched to the figure's cost concepts.
# drift is labelled "Flow", curvature "Momentum" to match the rest of the figure:
#   drift/Flow #009E73 (green) | volume #E69F00 (yellow) | curvature/Momentum #D55E00 (orange)
#   intensity #CC79A7 (pink) | coh/adh #56B4E9 (light blue) | full #0072B2 (blue) | none #999999

# =============================================================================
# Fluo-C3DL-MDA231 / 01_cells
# =============================================================================
# ---------------------------------------------------------------------------
# 2026-07-29 re-optimization. The 2026-07-21 fs1_cpm6 runs re-ran every condition
# on the improved segmentation but kept the ILP weights tuned on the OLD one,
# which left two ablations beating the full model. Every condition was re-swept
# on 01_cells (sweeps figopt0729A..G, ~200 runs; specs in configs/sweeps/) and
# the winners transferred verbatim to 02_cells. uids are now fs1cpm6v2_<cond>;
# the exact parameters per bar are in configs/sweeps/mda231_0{1,2}_cells_final.toml
# and in each run's saved config.toml. Baseline 01_cells 0.9061 -> 0.9122.
#
# Two definitional fixes went in with it: the retired ablate_cohesion_adhesion
# flag meant `- Affinities` had actually been solving with cohesion/adhesion
# ACTIVE, and it plus `- Merges` also carried z_flow_conf_threshold = 0.0, which
# no other condition sets and which is NOT a no-op (the 3D flow zarr does have a
# confidence array, so Z flow was being gated). Both are gone, so every merge bar
# now differs from Baseline in exactly one way.
# ---------------------------------------------------------------------------

[mda231]
experiment = "Fluo-C3DL-MDA231"
dataset_dir = "01_cells"
eval_base_dir = "Y:/jennifer/mhat/experiments/evaluation"
output_png = "Y:/jennifer/mhat/experiments/evaluation/Fluo-C3DL-MDA231/01_cells/solver_addition_results_mda231.png"
suptitle = "Fluo-C3DL-MDA231 Solver Addition"
reference = "last"
xtick_rotation = 30
condition_order = ["none", "plus_drift", "plus_curvature", "plus_volume", "plus_cohesion", "plus_intensity", "full"]

[mda231.metrics.TRA]
display_name = "TRA"
json_path = ["CTCMetrics", "TRA"]
reduction = "scalar"

[mda231.metrics.DET]
display_name = "DET"
json_path = ["CTCMetrics", "DET"]
reduction = "scalar"

[mda231.metrics.LNK]
display_name = "LNK"
json_path = ["CTCMetrics", "LNK"]
reduction = "scalar"

# mda231 addition conditions re-run 2026-07-21 on the fs1_cpm6 baseline seg
# seg_cp_20260720_fs1_cpm6 (cellprob=-6, flow3D_smooth=1). The active term is set;
# all other costs are zeroed (skipped). None uses base_edge_constant (= - All).
# Full = the full model (trk_cp_20260720_fs1_cpm6). `note` is informational.
