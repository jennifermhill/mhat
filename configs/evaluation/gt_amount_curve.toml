# GT-amount learning curve — see gt_amount_experiment_plan.md
#
# Single sweep, so the arm keys are plain "A"/"B" (the "arm|label" form is only
# needed when merging several sweeps via merge_gt_amount_csvs.py).
#
# Every run here is fit at a FIXED EFFECTIVE regularizer: stage 1 calibrated
# ssvm_reg on the fully annotated train split (19-point twelfth-decade grid,
# winner ssvm_reg = 0.0121 at n_labeled = 10877 -> effective 131.61), and each
# run divides that target by its own n_labeled. So the confound the old two-sweep
# figure had to display — small-GT fits being far less regularized than the
# full-GT fit — is designed out rather than plotted alongside.
#
# All three arms appear here because this is the HELD-OUT TEST split: the test GT is
# dense, full-length and identical for every arm, so the protocols are directly
# comparable (plan ground rule 3). The train-side figure stays at two arms.
#
# Arm C's crops are sized by annotation BUDGET, not by volume, so its points land on
# the same x as A/B's rather than scattered between them (plan ground rule 5).

csv_path = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation/NC281-sparse-label/02_nuclei_denoised_test/gt_amount/stage2_test.csv"
output_png = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation/NC281-sparse-label/02_nuclei_denoised_test/gt_amount/gt_amount_curve.png"

metric_column = "target_effectiveness"
ylabel = "Target effectiveness (held-out test)"
xlabel = "Annotated GT nodes used for fitting"
suptitle = ""

# Annotated NODES, not tracks: the two arms are only honestly comparable on the
# budget an annotator actually spends (one object per frame). Crop budgets are
# measured rather than requested, so fixed track ticks no longer fit.
x_field = "n_gt_nodes_annotated"
xticks = []

[arms.A]
label = "Arm A — unlabeled candidates removed"
color = "#0072B2"
linestyle = "-"

[arms.B]
label = "Arm B — gt_selected=None (motile API)"
color = "#E69F00"
linestyle = "-"

# Keep linestyle solid: a dashed style triggers the hollow-marker "control condition"
# styling used by the merged two-sweep figure, which would misread here.
[arms.C]
label = "Arm C — dense crop"
color = "#009E73"
linestyle = "-"

# Reference lines on the same held-out test split.
[baselines.hand_tuned]
label = "Hand-tuned (full GT)"
value = 0.8290
color = "#555555"

# NOTE: this is the OLDER full-GT SSVM run fit at ssvm_reg = 0.1 (effective ~1088).
# It is NOT expected to coincide with this sweep's n=167 point, which is fit at
# effective 131.61 — stage 1 showed that reg 0.1 is well into the over-regularized
# regime (train TE 0.7512 vs 0.8093 at the winner). Kept as a "what the old default
# cost you" marker, not as a correctness check.
[baselines.ssvm_full_gt_reg0p1]
label = "SSVM full GT, old ssvm_reg=0.1"
value = 0.7209
color = "#999999"
