# SSVM-fit solver addition plot input (MDA231 01_cells).
#
# Same structure/labels/colors as solver_addition.toml, but every tracking_uid
# points at an SSVM-fit run. Start from the empty model (None = only
# appear/disappear fit) and add ONE cost at a time up to Full (the 4-cost SSVM
# model). Note: None here == solver ablation's - All (both = ssvm_no_all).
# Drive with:
#   conda run -n mhat2 --no-capture-output \
#     python scripts/05_evaluation/solver_figure.py \
#     scripts/05_evaluation/ssvm_solver_addition.toml --dataset mda231

[mda231]
output_dir = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells"
output_png = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells/figures/solver_addition_results_mda231_ssvm.png"
suptitle = "Fluo-C3DL-MDA231 Solver Addition (SSVM-fit)"
reference = "last"
xtick_rotation = 30
# plus_curvature is intentionally omitted: curvature is an edge-PAIR cost and
# cannot be SSVM-fit in isolation (collapses to an empty solution). See the SSVM
# Weight Fitting section of CLAUDE.md.
condition_order = ["none", "plus_cohesion", "plus_intensity", "plus_volume", "plus_drift", "full"]

[mda231.metrics.TRA]
display_name = "TRA"
json_path = ["CTCMetrics", "TRA"]
reduction = "scalar"

[mda231.metrics.DET]
display_name = "DET"
json_path = ["CTCMetrics", "DET"]
reduction = "scalar"

[mda231.metrics.LNK]
display_name = "LNK"
json_path = ["CTCMetrics", "LNK"]
reduction = "scalar"

[mda231.conditions.none]
label = "None"
color = "#999999"
run = "ssvm/ssvm_no_all"
eval = "ctc_ctc_2026-07-07_15-22-09"

[mda231.conditions.plus_cohesion]
label = "+ Coh/Adh"
color = "#CC79A7"
run = "ssvm/ssvm_plus_cohesion"
eval = "ctc_ctc_2026-07-06_16-52-16"

[mda231.conditions.plus_intensity]
label = "+ Intensity"
color = "#56B4E9"
run = "ssvm/ssvm_plus_intensity"
eval = "ctc_ctc_2026-07-06_16-52-16"

[mda231.conditions.plus_volume]
label = "+ Volume"
color = "#E69F00"
run = "ssvm/ssvm_plus_volume"
eval = "ctc_ctc_2026-07-06_16-52-39"

# [mda231.conditions.plus_curvature] omitted -- see condition_order note above.

[mda231.conditions.plus_drift]
label = "+ Drift"
color = "#009E73"
run = "ssvm/ssvm_plus_drift"
eval = "ctc_ctc_2026-07-06_16-52-05"

[mda231.conditions.full]
label = "Full"
color = "#0072B2"
run = "ssvm/ssvm_full"
eval = "ctc_ctc_2026-07-06_16-50-20"
