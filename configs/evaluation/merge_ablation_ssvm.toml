# Merge ablation, SSVM-FIT weights -- companion to configs/evaluation/merge_ablation.toml.
#
# Same four bars, same segmentations, same candidate-graph parameters and the same
# cumulative-ablation definitions as the hand-tuned figure. The ONLY difference is how
# the ILP weights were chosen: structsvm bundle-method fitting against the 01_cells GT
# instead of a 37-point hand search scored on TRA/SEG. Nothing here is selected on a
# metric, so the bars are not biased by per-bar search depth.
#
# Regularizer: calibrated once on the Baseline (13-point grid, plateau rule) ->
# ssvm_reg = 0.0383, n_labeled = 1864, effective 71.39. Baseline, - Coh/Adh and
# - Affinities all have n_labeled = 1864, so that value ports verbatim. - Merges has
# n_labeled = 1437 (no merge hypotheses) and uses ssvm_reg = 0.049681 to hold the
# effective regularizer at 71.39; a sensitivity arm at the unported 0.0383
# (ssvm_merge_ablation/no_merges_regnom) moves TRA by <= 0.0015.
#
# 02_cells weights are the 01_cells fits applied VERBATIM -- nothing tuned on test.
#
# Paths are Linux (cluster), not the Y: paths the hand-tuned config uses, and the
# output_png names carry _ssvm_regen so they cannot collide with either the hand-tuned
# figures or the superseded 2026-07-06 merge_ablation_results_mda231_ssvm.png.
#
# Runs: experiments/tracking/Fluo-C3DL-MDA231/0{1,2}_cells/ssvm_merge_ablation/<cond>/
# Fit configs: scratch_configs/tracking/Fluo-C3DL-MDA231/0{1,2}_cells/ssvm_merge_ablation/

# Recall bars read BasicMetrics from track_metrics_basic.json, produced by a SECOND eval
# with metrics=["basic"], matcher="point", match_threshold=10 (BasicMetrics rejects the
# CTC matcher -- see ABLATION.md). Those settings were verified to reproduce the stored
# hand-tuned track_metrics_basic.json byte-for-byte on BOTH 01_cells and 02_cells. The
# basic evals were written to a scratch output_base_dir and copied in, so the CTC
# track_metrics.json files were never overwritten.

[mda231]
experiment = "Fluo-C3DL-MDA231"
dataset_dir = "01_cells"
eval_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation"
output_png = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation/Fluo-C3DL-MDA231/01_cells/merge_ablation_results_mda231_ssvm_regen.png"
suptitle = "Fluo-C3DL-MDA231 Merge Ablation - SSVM-fit weights (01_cells, train)"
recall_metrics_filename = "track_metrics_basic.json"
recall_output_png = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation/Fluo-C3DL-MDA231/01_cells/merge_ablation_recall_mda231_ssvm_regen.png"

[mda231_02cells]
experiment = "Fluo-C3DL-MDA231"
dataset_dir = "02_cells"
eval_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation"
output_png = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation/Fluo-C3DL-MDA231/02_cells/merge_ablation_results_mda231_02_ssvm_regen.png"
suptitle = "Fluo-C3DL-MDA231 02_cells Merge Ablation - SSVM-fit weights (held-out test)"
recall_metrics_filename = "track_metrics_basic.json"
recall_output_png = "/groups/sgro/sgrolab/jennifer/mhat/experiments/evaluation/Fluo-C3DL-MDA231/02_cells/merge_ablation_recall_mda231_02_ssvm_regen.png"

[mda231.metrics.TRA]
