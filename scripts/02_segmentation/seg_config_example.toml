# IO
input_base_dir = "/path/to/data/"
output_base_dir = "/path/to/experiments/segmentation/"
experiment = "experiment_1"
dataset = "dataset_1"

overwrite = false
merge_thresholds = [1.0]

# segmentation parameters
# seg_method: "cellpose", or a threshold method: "fixed", "otsu", "mean", "li", "triangle", "mad"
[seg_params]
seg_method = "otsu"
spot_sigma = 0.5
outline_sigma = 0.5
threshold = 500       # used when seg_method = "fixed"
mad_k = 5.0           # used when seg_method = "mad" (threshold = median + mad_k * robust_sigma)

[seg_params.cellpose_params]
flow_threshold = 0.4
cellprob_threshold = -3.0
batch_size = 32
do_3D = true

[affinity_params]
smoothing = [1, 1, 1]
neighborhood = [[0,0,1], [0,1,0], [1,0,0]]
