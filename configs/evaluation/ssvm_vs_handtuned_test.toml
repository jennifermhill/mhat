# Hand-tuned vs SSVM-fit comparison figure -- TEST sets (held-out).
# Hand-tuned params / SSVM weights are both fit on the train set, then evaluated on
# each dataset's held-out test set:
#   MDA231 -> 02_cells (TE, CTC matcher; switched from TRA on 2026-10-19);
#   NC281-sparse -> 02_nuclei_denoised_test (TE, point matcher). Rendered by
#   ssvm_vs_handtuned_figure.py.
#
# The SSVM bars are the CURRENT BEST fits: full-GT fits whose weights were learned on
# the train split at the regularizer calibrated there, then applied to the test split
# VERBATIM. Selecting the regularizer on train and only then scoring on test keeps this
# oracle-free.
#
# MDA231 was REFIT on 2026-09-30 after the waterz affinity-convention fix and the
# cellpose 4.0.7 -> 4.2.1.1 change; see the segmentation-parity note below. NC281 was
# REFIT on 2026-10-20 on the wzff inputs (fixed waterz convention + fixed flow).

output_png = "Y:/jennifer/mhat/experiments/_unsorted/evaluation/ssvm_vs_handtuned_test.png"
suptitle = ""
ylabel = "Target effectiveness (↑)"
dataset_order = ["nc281_test", "mda231"]

# Bars left to right, best first (the paper's convention): the hand-tuned
# ("Claude-tuned") model, SSVM, then the untuned negative control. Colors: Wong reddish purple #CC79A7 for Claude-tuned (the
# MHAT color in the method-comparison figures), the palette's gray #999999 for the
# negative control (as for "- All"/"None" in the solver figures), Wong yellow #F0E442
# for SSVM (orange #E69F00 until 2026-10-19; orange now means Dense GT in the GT-amount
# curve). The blues and the bluish green are kept off this figure because they mean
# Flow / Momentum / Coh-Adh elsewhere.
condition_order = ["hand_tuned", "ssvm", "mean_normalized"]

# Negative control: every feature z-scored over the run's own candidate graph,
# weight +1 (drift, area, intensity: larger is worse) or -1 (cohesion, adhesion:
# larger is better), every feature constant 0, appear = disappear = 1. Same feature
# set as the SSVM fits (curvature off). Nothing tuned, so it is run on test only.
# Code: normalize_features = "zscore" in run_tracking.py (experiments branch);
# configs: scratch_configs/{tracking,evaluation}/<exp>/<ds>/negctrl_*_config.toml in
# the mhat-cluster worktree; each eval dir carries normalized_costs.toml.
[conditions.mean_normalized]
label = "Naive"
color = "#999999"

[conditions.ssvm]
label = "Algorithmic"
color = "#F0E442"

[conditions.hand_tuned]
label = "Agentic"
color = "#CC79A7"

[datasets.mda231]
name = "MDA231"
output_dir = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/02_cells"
json_path = ["TrackOverlapMetrics", "target_effectiveness"]
reduction = "scalar"
#
# SEGMENTATION PARITY: both bars are seg fs1cpm6_seg_base_wzfix / flow
# 2026-09-22_14-13-30 -- the regenerated segmentation, i.e. post waterz-convention fix
# (2026-09-17) and cellpose 4.2.1.1. Do not point one bar back at the older seg without
# moving the other. Every candidate-graph parameter of the SSVM run is asserted equal to
# regenF02_baseline's, so the two bars differ only in the ILP weights.
#
# Superseded values, for reference: hand-tuned holdout_fs1_cpm6 TRA 0.9369, SSVM
# gt_amount/stage2_solves/gtm_full_n033_s0 TRA 0.9359, both on seg holdout_fs1_cpm6 /
# flow 2026-05-29_10-59-37.
# Negative control on the same seg/flow and candidate graph (graph cache shared).
[datasets.mda231.mean_normalized]
run = "tracking/negctrl_test"
# ctc + track_overlap re-eval for TE (2026-10-19, config
# scratch_configs/evaluation/Fluo-C3DL-MDA231/02_cells/negctrl_te_eval_config.toml);
# TRA reproduces the original ctc-only eval ctc_ctc_2026-10-01_14-48-53 exactly.
eval = "ctc_ctc+track_overlap_2026-10-19_15-27-21"
[datasets.mda231.hand_tuned]
run = "tracking/sweeps/regenF02/runs/baseline"
# TE needs track_overlap; this re-eval of the same run carries it (TRA identical to
# the ctc-only eval ctc_ctc_2026-09-22_16-12-37 the TRA version of this figure read).
eval = "ctc_f1aogm_ctc+f1_aogm+track_overlap_2026-10-14_15-24-20"
# Weights learned on 01_cells by the 2026-09-30 regularizer re-calibration
# (gt_amount/stage1_regsweep_regen/regsweep_r05, ssvm_reg 0.0383, train TRA 0.9099) and
# applied here verbatim. Solve config:
# scratch_configs/tracking/Fluo-C3DL-MDA231/02_cells/ssvm_regen_test_config.toml
[datasets.mda231.ssvm]
run = "tracking/sweeps/stage3_solves_regen/runs/regsweep_r05"
eval = "ctc_ctc+track_overlap_2026-09-30_14-56-05"

[datasets.nc281_test]
name = '$\mathit{Dictyostelium}$'   # literal string; mathtext -> italic tick label
output_dir = "Y:/jennifer/mhat/experiments/NC281-sparse-label/02_nuclei_denoised_test"
json_path = ["TrackOverlapMetrics", "target_effectiveness"]
reduction = "scalar"
# SEGMENTATION PARITY (2026-10-20): all three bars are seg 2026-07-08_14-40-36_wzfix /
# flow favgfix ("wzff"). The SSVM bar applies the weights of the train fit
# ssvm/sweeps/stage1_regsweep_wzff/runs/regsweep_r14 (ssvm_reg 0.00681) verbatim; solve
# config
# scratch_configs/tracking/NC281-sparse-label/02_nuclei_denoised_test/ssvm_wzff_test_config.toml,
# every candidate-graph parameter equal to test_full's. The negative control is the wzff
# rerun (configs scratch_configs/{tracking,evaluation}/NC281-sparse-label/
# 02_nuclei_denoised_test/negctrl_wzff_*_config.toml).
#
# Superseded values, for reference: hand-tuned tracking/test_full TE 0.8290 and SSVM
# tracking/sweeps/stage2_solves/runs/gt2_full_n167_s0 TE 0.8159, both on seg
# 2026-07-08_14-40-36 / flow 2026-07-08_14-46-03; negative control tracking/negctrl_test
# (seg _wzfix, pre-fix flow), eval manual_basic+track_overlap_2026-10-01_14-41-37.
[datasets.nc281_test.mean_normalized]
run = "tracking/negctrl_test_wzff"
eval = "manual_basic+f1_aogm+track_overlap_2026-10-20_11-30-52"
[datasets.nc281_test.hand_tuned]
run = "tracking/sweeps/wzff/runs/test_full"
eval = "wzff_basic+f1_aogm+track_overlap_2026-10-14_15-24-02"
[datasets.nc281_test.ssvm]
run = "tracking/sweeps/stage3_solves_wzff/runs/regsweep_r14"
eval = "manual_basic+f1_aogm+track_overlap_2026-10-20_11-20-15"
