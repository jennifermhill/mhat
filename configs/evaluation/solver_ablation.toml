# Solver ablation: running notes + plotting input.
#
# See SOLVER_EXPERIMENTS.md (repo root) for the recipe. Solver ablation starts
# from the full tuned model and removes ONE ILP cost term at a time via the
# `ablate_*` flags in scripts/04_tracking/tracking_config.toml. Segmentation is
# held FIXED (the dataset's baseline seg_uid) -- only tracking_config changes.
#
# Fill in tracking_uid as runs complete. `ablate_flags` and `note` are
# informational; the canonical config lives in the tracking result's saved
# config.toml. Plotting reads condition_order, per-condition color/label/uid.
#
# Drive the plot with:
#   conda run -n mhat2 --no-capture-output \
#     python scripts/07_plotting/solver_figure.py \
#     configs/evaluation/solver_ablation.toml --dataset {mda231,mda231_02cells,nc281,nc281_sparse}
#
# Wong colorblind-friendly palette, matched to the figure's cost concepts.
# drift is labelled "Flow", curvature "Momentum" to match the rest of the figure:
#   drift/Flow #56B4E9 (light blue) | curvature/Momentum #0072B2 (blue)
#   intensity #E69F00 (orange) | volume #D55E00 (vermillion) | coh/adh #009E73 (bluish green)
#   baseline #000000 (black) | all/none #999999 (gray)

# =============================================================================
# Fluo-C3DL-MDA231 / 01_cells
# =============================================================================
# ---------------------------------------------------------------------------
# 2026-07-29 re-optimization. The 2026-07-21 fs1_cpm6 runs re-ran every condition
# on the improved segmentation but kept the ILP weights tuned on the OLD one,
# which left two ablations beating the full model. Every condition was re-swept
# on 01_cells (sweeps figopt0729A..G, ~200 runs; specs in configs/sweeps/) and
# the winners transferred verbatim to 02_cells. uids are now fs1cpm6v2_<cond>;
# the exact parameters per bar are in configs/sweeps/mda231_0{1,2}_cells_final.toml
# and in each run's saved config.toml. Baseline 01_cells 0.9061 -> 0.9122.
#
# Two definitional fixes went in with it: the retired ablate_cohesion_adhesion
# flag meant `- Affinities` had actually been solving with cohesion/adhesion
# ACTIVE, and it plus `- Merges` also carried z_flow_conf_threshold = 0.0, which
# no other condition sets and which is NOT a no-op (the 3D flow zarr does have a
# confidence array, so Z flow was being gated). Both are gone, so every merge bar
# now differs from Baseline in exactly one way.
# ---------------------------------------------------------------------------

[mda231]
experiment = "Fluo-C3DL-MDA231"
dataset_dir = "01_cells"
eval_base_dir = "Y:/jennifer/mhat/experiments/evaluation"
output_png = "Y:/jennifer/mhat/experiments/evaluation/Fluo-C3DL-MDA231/01_cells/solver_ablation_results_mda231.png"
suptitle = "Fluo-C3DL-MDA231 Solver Ablation"
reference = "first"
condition_order = ["baseline", "no_drift", "no_volume", "no_cohesion", "no_intensity", "no_all"]
# dumbbell row order (top -> bottom); stripped cost keys. Read by contribution_dumbbell.py.
cost_order = ["drift", "curvature", "volume", "cohesion", "intensity"]

[mda231.metrics.TRA]
display_name = "TRA"
json_path = ["CTCMetrics", "TRA"]
reduction = "scalar"

[mda231.metrics.DET]
display_name = "DET"
json_path = ["CTCMetrics", "DET"]
reduction = "scalar"

[mda231.metrics.LNK]
display_name = "LNK"
json_path = ["CTCMetrics", "LNK"]
reduction = "scalar"

# mda231 ablation conditions re-run 2026-07-21 under weight/constant gating
# (skip-entirely) on the fs1_cpm6 baseline seg seg_cp_20260720_fs1_cpm6
# (cellprob=-6, flow3D_smooth=1). Baseline = full model (trk_cp_20260720_fs1_cpm6).
# `params` is informational; canonical config is in each run's saved config.toml.
[mda231.conditions.baseline]
label = "Baseline"
color = "#000000"
params = "full model; drift_constant=-4000, adhesion_weight=-500"
tracking_uid = "fs1cpm6v2_baseline"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/baseline_config.toml"

[mda231.conditions.no_intensity]
label = "- Intensity"
color = "#E69F00"
params = "intensity zeroed; drift_constant=-4000, adhesion_weight=-500"
tracking_uid = "fs1cpm6v2_no_intensity"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_intensity_config.toml"

[mda231.conditions.no_volume]
label = "- Volume"
color = "#D55E00"
params = "area zeroed; drift_constant=-5000, drift_weight=30"
tracking_uid = "fs1cpm6v2_no_volume"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_volume_config.toml"

[mda231.conditions.no_drift]
label = "- Flow"
color = "#56B4E9"
params = "drift zeroed; area_constant=-5000"
tracking_uid = "fs1cpm6v2_no_drift"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_drift_config.toml"

[mda231.conditions.no_cohesion]
label = "- Coh/Adh"
color = "#009E73"
params = "cohesion+adhesion zeroed; drift_weight=100, area_weight=2500"
tracking_uid = "fs1cpm6v2_no_cohesion"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_cohesion_config.toml"

[mda231.conditions.no_all]
label = "- All"
color = "#999999"
params = "all feature costs zeroed; base_edge_constant=-200"
tracking_uid = "fs1cpm6v2_no_all"
config = "configs/tracking/Fluo-C3DL-MDA231/01_cells/no_all_config.toml"

