[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "mhat"
version = "0.1.0"
description = "Experiments and scripts for mhat: multi-hypothesis segmentation and tracking."
readme = "README.md"
# 3.11 is the floor, and it comes from exactly one place: motile-tracker dropped
# 3.10 between 4.1.1 and 4.3.0. Everything else here accepts 3.10.
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
keywords = []
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "hillj@janelia.hhmi.org", name = "Sgro Lab" },
    { email = "malinmayorc@janelia.hhmi.org", name = "Funke Lab" },
]

# Core: stages 02_segmentation (threshold backends) through 05_evaluation, plus
# 07_plotting. Runs headless and CPU-only — no torch, no Qt, no GPU. Everything
# here installs from public PyPI on Linux, Windows and macOS.
dependencies = [
  # --- ILP tracking stack -----------------------------------------------------
  # Pinned to motile 0.3.x deliberately. src/mhat/tracking/{division_cost,
  # edge_pairs,leaves_scaled_costs}.py subclass motile extension points that are
  # not public API, and motile 0.4.0's "unify cost api" is exactly the change
  # that would break them. tests/test_tracking_pipeline.py is the contract that
  # guards this pin — run it before widening the range.
  "motile>=0.3,<0.4",
  "motile-toolbox==0.4.*",
  # ilpy >=0.5.3 is where Preference.Any falls back to SCIP when a Gurobi
  # license is restricted, which is what makes the license-free default work.
  # Both 0.5.3 and 0.6.0 are pure-python py3-none-any wheels.
  "ilpy>=0.5.3,<0.7",
  # SCIP is the default solver. PySCIPOpt's wheels bundle the SCIP binary, so no
  # system SCIP and no license are needed. Gurobi is the [gurobi] extra.
  "pyscipopt>=5,<7",
  # Pulled in by motile, but pinned to a git SHA rather than PyPI on purpose.
  #
  # PyPI's structsvm 0.2.0 lacks two commits that live on the upstream branch
  # `scale-features-and-costs` (unmerged, unreleased):
  #     fddf5a5  Add scaling factor
  #     6fbea1e  Rely on ilpy to include objective constant in solution value
  # `fddf5a5` divides the SoftMarginLoss terms by the number of labeled
  # variables, i.e. normalizes the loss per label. Without it the effective
  # regularization is `ssvm_reg * n_labeled`, so shrinking the ground-truth set
  # silently weakens regularization — a confound the GT-amount experiments are
  # specifically measuring against.
  #
  # This must stay consistent across every branch, so it lives here in core
  # rather than only on ssvm-fit. Both commits are archived under
  # mhat_local_patches/structsvm_commits/ in case the upstream branch is deleted.
  "structsvm @ git+https://github.com/funkelab/structsvm@6fbea1e9c332633cf24018801ed0dc3f39916da2",
  # --- tracks IO and evaluation ----------------------------------------------
  # funtracks <2 on purpose: 2.x is the tracksdata rewrite, and tracksdata is
  # still a release candidate.
  "funtracks>=1.8,<2",
  # >=1.3 because geff 1.2.x caps geff-spec at <1.2, and `node_prop` (which
  # replaced the deprecated `label_prop` in geff-spec 1.2.1) only exists from
  # the 1.2 line onward.
  "geff>=1.3,<2",
  # Imported directly by src/mhat/evaluation/from_ctc_to_geff.py for Axis,
  # GeffMetadata and RelatedObject, so it is declared rather than relied on as
  # a transitive of geff.
  "geff-spec>=1.2,<2",
  "traccuracy>=0.4.3,<0.5",
  # --- arrays, imaging, IO ----------------------------------------------------
  # zarr <3 because src/mhat/data.py and the stage 02/03 scripts use v2-only
  # APIs (NestedDirectoryStore, storage.contains_array, create_dataset(overwrite=)).
  # motile-tracker and funtracks both allow <4, so zarr 3 is a later, separate move.
  "zarr>=2.18.7,<3",
  "numcodecs>=0.13,<0.16",
  "numpy>=2,<3",
  "networkx>=3.4,<4",
  "pandas>=2.3.3",
  "scipy",
  "scikit-image>=0.25",
  "dask[array]>=2025.5.0",
  "tifffile",
  "toml",
  "tqdm",
  "matplotlib",
  # cv2, for 2D Farneback optical flow. Headless: nothing in the repo calls
  # imshow/waitKey/namedWindow, and installing both opencv-python and
  # opencv-python-headless makes which cv2 wins depend on import order.
  "opencv-python-headless>=4.10",
  "colorcet",
]

[project.optional-dependencies]
# napari GUI: the per-stage visualize_results.py scripts and
# scripts/05_evaluation/inspect_results.py.
#
# The [pyqt5] marker matters — plain `napari` installs no Qt binding at all, so
# the viewer would import and then fail to open a window. PyQt5 rather than
# conda-forge's pyqt on purpose: a conda GUI stack drags in conda numpy (MKL)
# and conda numba (llvm-openmp), which collide with pip's torch and abort the
# flow3d/segmentation extras. See the long note in environment.yml.
#
# PyQt5-Qt5 is the Qt runtime PyQt5 loads. Its wheel coverage is *disjoint*
# across its own releases and it publishes no sdist at any version, so no
# single version installs everywhere:
#     5.15.2             win32, win_amd64, macosx_10_13_intel, manylinux2014_x86_64
#     5.15.16 - 5.15.19  macosx_10_13_x86_64, macosx_11_0_arm64, manylinux2014_x86_64
# 5.15.2 is the only release with Windows wheels and the only one *without* an
# Apple-silicon wheel. macos-latest has been arm64 since 2024.
#
# Left alone, uv's universal resolution forks that split exactly backwards --
# 5.15.19 on win32, 5.15.2 everywhere else -- so both windows-latest and
# macos-latest resolve to a version with no wheel for them. The cause is a typo
# in napari's own metadata: its [pyqt5] extra declares
#     pyqt5-qt5<=5.15.2; sys_platform == "Windows"
# and "Windows" is never a real sys_platform value (it is "win32"). The pin is
# therefore inert at install time, but a universal resolver cannot prove that,
# so it caps the non-win32 fork -- the one that actually contains macOS -- at
# 5.15.2.
#
# A normal dependency pin cannot undo that -- it just makes the resolution
# unsatisfiable -- so the split is forced with `override-dependencies` under
# [tool.uv] at the bottom of this file, which is the mechanism for exactly this
# case: upstream metadata that is wrong. Plain `pip install mhat[napari]` is
# unaffected either way; pip resolves one platform at a time and backtracks.
napari = [
  "motile-tracker>=4.6.1,<5",
  "napari[pyqt5]>=0.6.2,<1",
  "napari-orthogonal-views>=0.2.1",
  "itables",
]

# 3D Farneback optical flow (compute_farneback_flow_3d). This is a PyTorch fork
# of opticalflow3d; the PyPI package of that name is the original cupy/CUDA
# build and is NOT a substitute. It is GPLv3 while mhat is BSD-3, so it stays a
# separate distribution and is never vendored.
flow3d = [
  "torch",
  # Pinned to the tag, not the branch: an unpinned git ref silently follows main
  # and cannot be hash-pinned by conda-lock. v0.4.0 is also the version that
  # distinguishes this fork from the unrelated cupy/CUDA `opticalflow3d 0.3.2`
  # on PyPI, which shares the distribution name.
  "opticalflow3d @ git+https://github.com/jennifermhill/opticalflow3d@v0.4.0",
]

# Cellpose segmentation backend (seg_method = "cellpose"). The threshold
# backends need none of this.
segmentation = [
  "cellpose",
  "torch",
]

# Affinity/agglomeration fragment generation.
#
# Linux only for now. PyPI's `waterz` is 0.9.4 (2020) with manylinux cp27-cp38
# wheels and no sdist, so it cannot install here at all — hence the git pin.
# Tag v0.9.6 does NOT work either: its generated evaluate.cpp is committed and
# includes the pre-3.11 "longintrepr.h", so it fails to compile on Python 3.11.
# master dropped the generated sources, so Cython runs at build time.
# Needs a C++ toolchain and Boost headers.
waterz = [
  "waterz @ git+https://github.com/funkey/waterz@a0184d2af2ab3ed044721fb92822fc6ea9cee665",
]

# Opt-in commercial solver. Requires your own Gurobi license.
gurobi = [
  "ilpy[gurobi]>=0.5.3,<0.7",
]

dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pdoc",
  "pre-commit",
  # uv, not conda-lock: conda supplies only the interpreter here, so a single
  # cross-platform uv.lock covers the whole dependency set.
  "uv",
]

# Convenience bundle. NOT "every extra" — it deliberately omits two:
#   waterz  because it is Linux-only and needs a C++ toolchain plus Boost, so
#           including it here would make `pip install mhat[all]` fail outright
#           on Windows and macOS.
#   gurobi  because it requires a commercial licence.
# So `[all]` cannot be used to verify that every extra installs; install each
# one separately for that.
#
# Verified safe in an environment.yml environment (2026-08-24): napari, torch,
# cellpose and opticalflow3d coexist because the whole stack is pip-native and
# therefore loads a single OpenMP runtime. Adding these to a conda-forge
# scientific stack instead aborts at import — see the note in environment.yml.
all = [
  "mhat[napari,flow3d,segmentation]",
]

[project.urls]
homepage = "https://github.com/jennifermhill/mhat"
repository = "https://github.com/jennifermhill/mhat"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# https://github.com/charliermarsh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "E",    # style errors
    "F",    # flakes
    "I001", # isort
    "U",    # pyupgrade
    "S",    # bandit
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
]
ignore = [
  "S311",   # random numbers for cryptography
  "S101",   # asserts not allowed
]

[tool.uv]
# Force PyQt5-Qt5's platform split. See the long note above the [napari] extra:
# no single release has wheels for both Windows and Apple silicon, there is no
# sdist to fall back on, and napari's `sys_platform == "Windows"` typo makes
# uv's universal resolver cap the wrong fork. An override rather than a
# dependency because it has to *replace* napari's pin, not be reconciled with
# it. Both bounds sit inside PyQt5 5.15.11's own >=5.15.2,<5.16 requirement.
override-dependencies = [
  "PyQt5-Qt5==5.15.2; sys_platform == 'win32'",
  "PyQt5-Qt5>=5.15.17,<5.16; sys_platform != 'win32'",
]
