# Ultrack vs MHAT comparison figure on primary_nk_cells / 01_cells.
# Mirrors trackmate_vs_mhat.toml (NC281-sparse / train) but: (1) no track purity
# -- MHAT selects ~5x more objects than Ultrack here, so purity reflects the size
# of the candidate set more than track quality; recall/coverage are the reliable
# targets; (2) Ultrack replaces TrackMate. Both results were evaluated against
# the corrected ground truth (2026-07-30) with matcher = "point",
# match_threshold = 10.
# Rendered by competitor_vs_mhat.py (same script as the NC281 figure).

output_png = "Y:/jennifer/mhat/experiments/evaluation/primary_nk_cells/01_cells/ultrack_vs_mhat_nk_cells.png"
title = ""
ylabel = "Score (higher is better)"

experiment = "primary_nk_cells"
dataset_dir = "01_cells"
eval_base_dir = "Y:/jennifer/mhat/experiments/evaluation"

# x-groups: track-coverage metrics first, then the per-object recalls.
metric_order = ["target_effectiveness", "track_fractions", "node_recall", "edge_recall"]

[metrics.target_effectiveness]
label = "Target\neffectiveness"
json_path = ["TrackOverlapMetrics", "target_effectiveness"]

[metrics.track_fractions]
label = "Track\nfractions"
json_path = ["TrackOverlapMetrics", "track_fractions"]

[metrics.node_recall]
label = "Node\nrecall"
json_path = ["BasicMetrics", "Node Recall"]

[metrics.edge_recall]
label = "Edge\nrecall"
json_path = ["BasicMetrics", "Edge Recall"]

# series: MHAT first in each group, in the reddish pink that marks it in the
# leaderboard figure; the competing method is gray.
method_order = ["mhat", "ultrack"]

[methods.mhat]
label = "MHAT"
color = "#CC79A7"
tracking_uid = "nkgraph_size120"  # campaign best (Phase 6 Stage 2: size_threshold=120, max_children=5)

[methods.ultrack]
label = "Ultrack"
color = "#B0B0B0"
tracking_uid = "ultrack"
