# IO
input_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/data/"
output_base_dir = "/groups/sgro/sgrolab/jennifer/mhat/experiments/segmentation/"
experiment = "Fluo-C3DL-MDA231"
dataset = "01_cells"

overwrite = false
merge_thresholds = [1.0]
skip_merges = false

# segmentation parameters
[seg_params]
seg_method = "cellpose"
spot_sigma = 3.0
outline_sigma = 0.5

[affinity_params]
smoothing = [1, 1, 1]
neighborhood = [[0,0,1], [0,1,0], [1,0,0]]

[waterz_params]
scoring_function = "symmetric"
