# IO
input_base_dir = "Y:/jennifer/mhat/experiments/"
output_base_dir = "Y:/jennifer/mhat/experiments/"
experiment = "primary_nk_cells"
dataset = "01_cells"
# ctc_gt = "02_GT"

track_result = "nkgraph_size120"

# Eval settings
metrics = ["basic", "track_overlap"]
matcher = "point"
# iou_threshold = 0.25
match_threshold = 10

# Diagnostics written to <output_dir>/diagnostics/ after the metrics.
# All default to on; uncomment to tune or disable. Keep this table last —
# any key below a TOML table header belongs to that table.
# [diagnostics]
# enabled = true              # master switch for all three analyses
# fn_edges = true             # TP vs FN GT edges, and what was picked instead
# fn_nodes = true             # segmentation vs solver vs matcher misses
# gt_drift = true             # raw vs flow-corrected GT displacement
# plots = true                # histogram PNGs
# proximity_threshold = 20.0  # FN node "is anything here?" radius (world units);
#                             # defaults to match_threshold, else 20
# max_listed = 500            # cap on individually listed FN nodes
