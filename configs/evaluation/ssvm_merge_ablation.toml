# SSVM-fit merge ablation plot input (MDA231 01_cells).
#
# Same structure/labels as merge_ablation.toml (condition order + palette are
# hardcoded in merge_ablation_figure.py: baseline/no_cohesion/no_affinities/
# no_merges). Every tracking_uid points at an SSVM-fit run. Merge conditions
# vary the segmentation (and drop cohesion/adhesion where affinity-derived, as
# in the hand-tuned configs). Drive with:
#   conda run -n mhat2 --no-capture-output \
#     python scripts/05_evaluation/merge_ablation_figure.py \
#     scripts/05_evaluation/ssvm_merge_ablation.toml --dataset mda231

[mda231]
output_dir = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells"
output_png = "Y:/jennifer/mhat/experiments/Fluo-C3DL-MDA231/01_cells/figures/merge_ablation_results_mda231_ssvm.png"
suptitle = "Fluo-C3DL-MDA231 Merge Ablation (SSVM-fit)"

[mda231.metrics.TRA]
display_name = "TRA"
json_path = ["CTCMetrics", "TRA"]
reduction = "scalar"

[mda231.metrics.DET]
display_name = "DET"
json_path = ["CTCMetrics", "DET"]
reduction = "scalar"

[mda231.metrics.LNK]
display_name = "LNK"
json_path = ["CTCMetrics", "LNK"]
reduction = "scalar"

[mda231.conditions.baseline]
label = "Baseline"
run = "ssvm/ssvm_full"
eval = "ctc_ctc_2026-07-06_16-50-20"

[mda231.conditions.no_cohesion]
label = "- Coh/Adh"
run = "ssvm/ssvm_no_cohesion"
eval = "ctc_ctc_2026-07-06_16-53-53"

[mda231.conditions.no_affinities]
label = "- Affinities"
run = "ssvm/ssvm_no_affinities"
eval = "ctc_ctc_2026-07-06_16-52-05"

# The ssvm_no_merges fit never finished, so this bar has no result; it was
# plotted as a zero before. Left as a placeholder, which plot_spec.py skips.
[mda231.conditions.no_merges]
label = "- Merges"
run = "<fill in>"
eval = "<fill in>"
