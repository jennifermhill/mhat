# IO
# The raw movie: a zarr array (t, c, *spatial) with an "axes" attribute.
raw_path = "/path/to/data/movie.zarr"
# One directory per raw movie. Runs go to <output_dir>/opticalflow/{2d,3d}/<uid>/.
output_dir = "/path/to/results/movie/"
# Optional: a fixed run uid instead of a timestamp, shared by the 2D and 3D flow. It
# must not exist yet; to redo a run under the same uid, delete its directories first.
# exp_uid = "my_flow"

rerun_uid = ""

# display params
color_wheel = true

# 2D flow parameters
[2d]
do_2d = true
downsample_factor = 1
pyr_scale = 0.5
levels = 3
winsize = 15
iterations = 8
poly_n = 5
poly_sigma = 1.2
[2d.hyperparams]
enhance_contrast = true
temporal_smoothing = true
temporal_smoothing_sigma = 0.7
frame_averaging = 3

# 3D flow parameters
[3d]
do_3d = true
downsample_factor = [ 1, 1, 1,]
pyr_scale = [ 0.5, 0.5, 0.5,]
levels = 3
winsize = [ 5, 15, 15,]
iterations = 8
poly_n = 3
poly_sigma = [ 0.37, 1.2, 1.2,]
filter_type = "gaussian"
presmoothing = 0.1
[3d.hyperparams]
enhance_contrast = true
temporal_smoothing = true
temporal_smoothing_sigma = 0.7
frame_averaging = 3
